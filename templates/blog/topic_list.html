{% extends 'base.html' %}

{% block title %}
Topics List
{% endblock %}

{% block content %}
<h1>All Topics</h1>
<ul>
    {% for topic in topics %}
        <li>
            <a href="{% url 'topic_detail' topic.id %}">
                {{topic.name}}
            </a>
        </li>
    {% empty %}
        <li>No topics yet</li>
    {% endfor %}
</ul>
{% endblock %}
